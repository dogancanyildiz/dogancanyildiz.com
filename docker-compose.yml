# Local verification only.
#
# Coolify does NOT use this file. Production is built with the Dockerfile
# build pack, because the compose build pack disables Coolify's zero downtime
# rolling update (see docs/06-devops-ve-deploy.md section 1).
#
# Usage:
#   docker compose up --build -d
#   curl -s http://127.0.0.1:3000/api/health
#   docker compose down

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        # Optional, empty by default: the build still succeeds without them,
        # the footer's build info just renders blank (see
        # src/lib/build-info.ts). Export them before `docker compose up
        # --build` to exercise the real values, e.g.:
        #   NEXT_PUBLIC_BUILD_SHA=$(git rev-parse --short HEAD) \
        #   NEXT_PUBLIC_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        #     docker compose up --build -d
        NEXT_PUBLIC_BUILD_SHA: "${NEXT_PUBLIC_BUILD_SHA:-}"
        NEXT_PUBLIC_BUILD_DATE: "${NEXT_PUBLIC_BUILD_DATE:-}"
    # Not faz-numbered: the phases that named earlier builds are closed, and
    # "local" describes what this image is for regardless of which phase
    # touches it next.
    image: portfolio-local:latest
    container_name: portfolio-local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Runtime only values. Left empty on purpose so a local run never
      # sends real mail. Provide them through a shell export when the
      # contact endpoint is being tested.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
      FROM_EMAIL: "${FROM_EMAIL:-}"
    restart: "no"

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Velite output is gitignored, so the content has to be compiled before
      # typecheck and test can resolve the #site/content alias.
      - name: Compile content
        run: npm run build:content
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build time only. The value never has to be a secret, it is inlined
          # into the client bundle anyway.
          NEXT_PUBLIC_SITE_URL: https://dogancanyildiz.com
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_DATE: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
      - name: Verify static routes
        run: npm run verify:routes
      - name: Verify live links
        run: npm run verify:links

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine hadolint --failure-threshold warning - < Dockerfile
      - name: Build the production image
        # No registry login and no push on purpose. Coolify builds and keeps
        # the image on the server, this job is only a gate.
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://dogancanyildiz.com -t portfolio-ci:${{ github.sha }} .

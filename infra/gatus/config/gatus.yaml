# Public status configuration for dogancanyildiz.com
# Rules:
#   - Only public URLs are listed here. No internal hostname, no container name,
#     no private IP, no port of an internal service.
#   - This instance runs on the same host it monitors, so it cannot page anyone
#     when that host itself is down. See infra/README.md "Alerting" for what
#     the alerting block below can and cannot cover, and why an external
#     monitor is still recommended.
metrics: false
concurrency: 2

storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: status.dogancanyildiz.com
  header: Status
  dark-mode: true

# A failing endpoint only shows up here if someone happens to look at the
# dashboard. This block turns a failure into a notification instead.
#
# Active by default: a generic webhook (Gatus's "custom" provider), fed by
# GATUS_ALERT_WEBHOOK_URL. The body below is plain enough to work unmodified
# with Discord and Slack incoming webhooks (both accept a bare
# `{"content"/"text": "..."}` JSON body) and with most other webhook
# receivers (ntfy, a Coolify/n8n hook, etc). If GATUS_ALERT_WEBHOOK_URL is
# unset or empty, Gatus treats the provider as "not configured" and sends
# nothing: https://github.com/TwiN/gatus README, "Alerting" section.
#
# Prefer a dedicated provider (a real Discord embed, Slack blocks, or email)
# instead? Comment this block out and uncomment one of the examples below it.
alerting:
  custom:
    url: "${GATUS_ALERT_WEBHOOK_URL}"
    method: "POST"
    body: '{"content":"[ENDPOINT_GROUP]_[ENDPOINT_NAME]: [ALERT_DESCRIPTION] ([RESULT_ERRORS])"}'
    headers:
      Content-Type: "application/json"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: dogancanyildiz.com status

  # --- Example: email instead of a webhook -----------------------------
  # email:
  #   from: "${GATUS_ALERT_EMAIL_FROM}"
  #   username: "${GATUS_ALERT_EMAIL_FROM}"
  #   password: "${GATUS_ALERT_EMAIL_PASSWORD}"
  #   host: "${GATUS_ALERT_EMAIL_HOST}"
  #   port: 587
  #   to: "${GATUS_ALERT_EMAIL_TO}"
  #   default-alert:
  #     failure-threshold: 3
  #     success-threshold: 2
  #     send-on-resolved: true

  # --- Example: a differently-worded generic webhook body --------------
  # A replacement for the active `custom` block above, not an addition:
  # `alerting:` holds a single `custom` key, so uncommenting this while
  # the block above is also active is a duplicate YAML key, and Gatus only
  # ever runs one custom provider anyway. Comment out the block above first.
  # custom:
  #   url: "${GATUS_ALERT_WEBHOOK_URL_SECONDARY}"
  #   method: "POST"
  #   body: '{"text":"[ENDPOINT_NAME]: [ALERT_DESCRIPTION] ([RESULT_ERRORS])"}'
  #   headers:
  #     Content-Type: "application/json"
  #   default-alert:
  #     failure-threshold: 3
  #     success-threshold: 2
  #     send-on-resolved: true

endpoints:
  - name: site
    group: public
    url: https://dogancanyildiz.com/api/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: custom
  # Monitored but intentionally not rendered by the site widget: src/lib/status.ts
  # only ever returns the entry whose key equals SITE_ENDPOINT_KEY.
  - name: umami
    group: public
    url: https://analytics.dogancanyildiz.com/api/heartbeat
    interval: 300s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom

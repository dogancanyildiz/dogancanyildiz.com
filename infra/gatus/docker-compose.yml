services:
  gatus:
    # "v5" is not a published tag (twinproduction/gatus only ships full
    # vX.Y.Z tags), so this would fail to pull. Pinned to the latest v5.x
    # release as of 2026-08-28; bump deliberately.
    image: twinproduction/gatus:v5.36.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_GATUS_8080: /
      GATUS_CONFIG_PATH: /config/config.yaml
      GATUS_LOG_LEVEL: WARN
      # Read by config/gatus.yaml's `${GATUS_ALERT_WEBHOOK_URL}` substitution.
      # Set to a Discord/Slack incoming webhook URL (or any webhook receiver)
      # in Coolify to turn on alerting; left unset, Gatus sends no alerts.
      GATUS_ALERT_WEBHOOK_URL: ${GATUS_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./config/gatus.yaml:/config/config.yaml:ro
      - gatus-data:/data
    expose:
      - "8080"

volumes:
  gatus-data:

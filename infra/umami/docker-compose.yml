# SECURITY: the first deploy of this stack comes up with Umami's built-in
# admin/umami login, publicly reachable at the domain below. The official
# image has no env var to seed a different password on first boot (checked
# against the umami-software/umami docs and image README as of 2026-08;
# tracked upstream as umami-software/umami#4083). Log in and change the
# admin password before announcing or linking this domain anywhere public.
# See infra/README.md "Umami first boot" for the exact steps and
# docs/plans/handoffs/faz-5-manual-checklist.md for the checklist ordering
# that keeps this window short.
services:
  umami:
    # Pinned, not "postgresql-latest": bump deliberately, verify the digest
    # against ghcr.io/umami-software/umami first. postgresql-latest and this
    # tag point at the same image as of 2026-08-28.
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    environment:
      SERVICE_FQDN_UMAMI_3000: /
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${SERVICE_PASSWORD_UMAMIDB}@umami-db:5432/umami
      APP_SECRET: ${SERVICE_PASSWORD_UMAMIAPP}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  umami-db:
    # Pinned to the current 17.x patch, not the floating "17-alpine" tag.
    # Bump deliberately when a newer 17.x patch ships.
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_UMAMIDB}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  umami-db-data:
